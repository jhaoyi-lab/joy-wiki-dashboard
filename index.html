<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Joy Wiki 研究資料庫｜需要密碼</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 20px;
    color: #28231e;
    background: #f7f4ed;
    font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  }
  .card {
    width: min(420px, 100%);
    padding: 28px;
    border: 1px solid #dfd6c6;
    border-radius: 16px;
    background: #fff;
    box-shadow: 0 16px 50px rgba(50, 38, 22, .09);
  }
  h1 { margin: 0 0 6px; font-size: 24px; }
  p { margin: 0 0 20px; color: #746c62; }
  label { display: block; margin-bottom: 6px; font-size: 12px; font-weight: 700; }
  .password-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
  input, button { min-height: 42px; border-radius: 9px; font: inherit; }
  input { width: 100%; border: 1px solid #dfd6c6; padding: 8px 11px; }
  button { border: 0; padding: 8px 15px; background: #9a6726; color: #fff; font-weight: 700; cursor: pointer; }
  button:disabled { opacity: .55; cursor: wait; }
  .toggle { margin-top: 8px; border: 0; padding: 0; min-height: auto; background: transparent; color: #315f58; font-size: 12px; }
  .message { min-height: 22px; margin-top: 14px; color: #a13e3e; font-size: 12px; }
  .source { margin-top: 16px; color: #9a938a; font-size: 11px; }
</style>
</head>
<body>
<main class="card">
  <h1>Joy Wiki 研究資料庫</h1>
  <p>這個頁面需要共用密碼才能查看。</p>
  <form id="unlockForm">
    <label for="password">共用密碼</label>
    <div class="password-row">
      <input id="password" type="password" autocomplete="current-password" required autofocus>
      <button id="unlockButton" type="submit">解鎖</button>
    </div>
    <button class="toggle" id="togglePassword" type="button">顯示密碼</button>
    <div class="message" id="message" role="alert" aria-live="polite"></div>
  </form>
  <div class="source">受保護版本：dashboard.html</div>
</main>

function fromBase64(value) {
  return Uint8Array.from(atob(value), character => character.charCodeAt(0));
}

function toBase64(bytes) {
  let binary = "";
  bytes.forEach(byte => { binary += String.fromCharCode(byte); });
  return btoa(binary);
}

async function deriveKeyBytes(password) {
  const material = await crypto.subtle.importKey(
    "raw",
    new TextEncoder().encode(password),
    "PBKDF2",
    false,
    ["deriveBits"]
  );
  const bits = await crypto.subtle.deriveBits(
    {
      name: "PBKDF2",
      salt: fromBase64(ENCRYPTED.salt),
      iterations: ENCRYPTED.iterations,
      hash: "SHA-256"
    },
    material,
    256
  );
  return new Uint8Array(bits);
}

async function decryptWithKeyBytes(keyBytes) {
  const key = await crypto.subtle.importKey(
    "raw",
    keyBytes,
    { name: "AES-GCM" },
    false,
    ["decrypt"]
  );
  const plaintext = await crypto.subtle.decrypt(
    { name: "AES-GCM", iv: fromBase64(ENCRYPTED.nonce) },
    key,
    fromBase64(ENCRYPTED.ciphertext)
  );
  return new TextDecoder().decode(plaintext);
}

function openDashboard(content) {
  document.open();
  document.write(content);
  document.close();
}

async function unlock(password) {
  const keyBytes = await deriveKeyBytes(password);
  const content = await decryptWithKeyBytes(keyBytes);
  sessionStorage.setItem(STORAGE_KEY, toBase64(keyBytes));
  openDashboard(content);
}

const form = document.getElementById("unlockForm");
const passwordInput = document.getElementById("password");
const unlockButton = document.getElementById("unlockButton");
const message = document.getElementById("message");
const togglePassword = document.getElementById("togglePassword");

togglePassword.addEventListener("click", () => {
  const showing = passwordInput.type === "text";
  passwordInput.type = showing ? "password" : "text";
  togglePassword.textContent = showing ? "顯示密碼" : "隱藏密碼";
  passwordInput.focus();
});

form.addEventListener("submit", async event => {
  event.preventDefault();
  unlockButton.disabled = true;
  message.textContent = "正在驗證…";
  try {
    await unlock(passwordInput.value);
  } catch (error) {
    passwordInput.value = "";
    passwordInput.focus();
    message.textContent = "密碼錯誤，請重新輸入。";
    unlockButton.disabled = false;
  }
});

(async () => {
  const savedKey = sessionStorage.getItem(STORAGE_KEY);
  if (!savedKey) return;
  try {
    openDashboard(await decryptWithKeyBytes(fromBase64(savedKey)));
  } catch (error) {
    sessionStorage.removeItem(STORAGE_KEY);
  }
})();
</script>
</body>
</html>
